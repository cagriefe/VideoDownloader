name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Optional: the subtitle-embedding test is skipped without ffmpeg, so a slow mirror mustn't block the run.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        timeout-minutes: 4
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes main.py videodownloader tests
      - name: Run tests
        run: python -m unittest -v
